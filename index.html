<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hostel Management</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #222;
}

header {
    background: #182848;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    font-size: 26px;
    margin-bottom: 6px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat h3 {
    color: #666;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat p {
    font-size: 25px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
    margin-bottom: 18px;
}

.rooms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.room {
    padding: 18px;
    border-radius: 10px;
    border: 2px solid #ddd;
}

.room.vacant {
    border-color: #2e7d32;
    background: #f1f8f2;
}

.room.occupied {
    border-color: #c62828;
    background: #fff4f4;
}

.room h3 {
    margin-bottom: 8px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    cursor: pointer;
    background: #182848;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: 0.9;
}

button.delete {
    background: #c62828;
}

button.payment {
    background: #2e7d32;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f1f3f5;
}

.balance {
    font-weight: bold;
}

.balance.owing {
    color: #c62828;
}

.balance.paid {
    color: #2e7d32;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #777;
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 7px;
    display: none;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
}

@media (max-width: 700px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .rooms {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 12px;
        display: block;
        overflow-x: auto;
    }

}

</style>
</head>

<body>

<header>

<h1>🏠 Hostel Management</h1>

<p>Tenant & Payment Dashboard</p>

</header>


<div class="container">


<!-- DASHBOARD -->

<div class="stats">

<div class="stat">
<h3>Total Rooms</h3>
<p id="totalRooms">16</p>
</div>

<div class="stat">
<h3>Occupied</h3>
<p id="occupiedRooms">0</p>
</div>

<div class="stat">
<h3>Vacant</h3>
<p id="vacantRooms">16</p>
</div>

<div class="stat">
<h3>Outstanding</h3>
<p id="outstanding">GH₵0</p>
</div>

</div>


<!-- ROOMS -->

<div class="section">

<h2>🏠 Rooms</h2>

<div id="rooms" class="rooms"></div>

</div>


<!-- ADD TENANT -->

<div class="section">

<h2>👤 Add Tenant</h2>

<div class="form-grid">

<div>

<label>Tenant Name</label>

<input
id="tenantName"
type="text"
placeholder="Enter tenant name">

</div>


<div>

<label>Phone Number</label>

<input
id="tenantPhone"
type="tel"
placeholder="Enter phone number">

</div>


<div>

<label>Room</label>

<select id="tenantRoom">

<option value="">
Select a room
</option>

</select>

</div>


<div>

<label>Monthly Rent (GH₵)</label>

<input
id="tenantRent"
type="number"
placeholder="Example: 1500">

</div>

</div>


<button id="addTenantButton">
Add Tenant
</button>


<div
id="tenantMessage"
class="message">
</div>

</div>


<!-- TENANTS -->

<div class="section">

<h2>👥 Tenants</h2>

<div id="tenantTable"></div>

</div>


<!-- PAYMENTS -->

<div class="section">

<h2>💰 Record Payment</h2>

<div class="form-grid">

<div>

<label>Tenant</label>

<select id="paymentTenant">

<option value="">
Select a tenant
</option>

</select>

</div>


<div>

<label>Amount (GH₵)</label>

<input
id="paymentAmount"
type="number"
placeholder="Enter amount">

</div>


<div>

<label>Payment Method</label>

<select id="paymentMethod">

<option>Cash</option>

<option>Mobile Money</option>

<option>Bank Transfer</option>

</select>

</div>


<div>

<label>Date</label>

<input
id="paymentDate"
type="date">

</div>

</div>


<button
id="recordPaymentButton"
class="payment">

Record Payment

</button>


<div
id="paymentMessage"
class="message">
</div>

</div>


<!-- PAYMENT HISTORY -->

<div class="section">

<h2>📜 Payment History</h2>

<div id="paymentTable"></div>

</div>


</div>


<script>

const TOTAL_ROOMS = 16;


let tenants =
JSON.parse(
localStorage.getItem("hostelTenants")
) || [];


let payments =
JSON.parse(
localStorage.getItem("hostelPayments")
) || [];



function saveData() {

localStorage.setItem(
"hostelTenants",
JSON.stringify(tenants)
);

localStorage.setItem(
"hostelPayments",
JSON.stringify(payments)
);

}



function showMessage(
elementId,
message,
type
) {

const element =
document.getElementById(
elementId
);

element.textContent =
message;

element.className =
"message " + type;

element.style.display =
"block";

setTimeout(() => {

element.style.display =
"none";

}, 3000);

}



function addTenant() {

const name =
document
.getElementById("tenantName")
.value
.trim();


const phone =
document
.getElementById("tenantPhone")
.value
.trim();


const room =
document
.getElementById("tenantRoom")
.value;


const rent =
Number(
document
.getElementById("tenantRent")
.value
);


if (
!name ||
!phone ||
!room ||
!rent
) {

showMessage(
"tenantMessage",
"Please fill in all fields.",
"error"
);

return;

}


const roomTaken =
tenants.some(
tenant =>
String(tenant.room) ===
String(room)
);


if (roomTaken) {

showMessage(
"tenantMessage",
"This room is already occupied.",
"error"
);

return;

}


const tenant = {

id: Date.now(),

name: name,

phone: phone,

room: Number(room),

rent: rent,

dateAdded:
new Date()
.toLocaleDateString()

};


tenants.push(tenant);

saveData();


document
.getElementById("tenantName")
.value = "";


document
.getElementById("tenantPhone")
.value = "";


document
.getElementById("tenantRent")
.value = "";


render();


showMessage(
"tenantMessage",
"Tenant added successfully!",
"success"
);

}



function deleteTenant(id) {

if (
!confirm(
"Remove this tenant?"
)
) {

return;

}


tenants =
tenants.filter(
tenant =>
tenant.id !== id
);


payments =
payments.filter(
payment =>
payment.tenantId !== id
);


saveData();

render();

}



function recordPayment() {

const tenantId =
Number(
document
.getElementById(
"paymentTenant"
)
.value
);


const amount =
Number(
document
.getElementById(
"paymentAmount"
)
.value
);


const method =
document
.getElementById(
"paymentMethod"
)
.value;


const date =
document
.getElementById(
"paymentDate"
)
.value;


if (
!tenantId ||
!amount ||
!date
) {

showMessage(
"paymentMessage",
"Please complete all payment fields.",
"error"
);

return;

}


const payment = {

id: Date.now(),

tenantId: tenantId,

amount: amount,

method: method,

date: date

};


payments.push(payment);

saveData();


document
.getElementById(
"paymentAmount"
)
.value = "";


render();


showMessage(
"paymentMessage",
"Payment recorded successfully!",
"success"
);

}



function getTenantPaid(
tenantId
) {

return payments

.filter(
payment =>
Number(payment.tenantId) ===
Number(tenantId)
)

.reduce(
(total, payment) =>
total +
Number(payment.amount),
0
);

}



function renderRooms() {

const rooms =
document.getElementById(
"rooms"
);

rooms.innerHTML = "";


for (
let roomNumber = 1;
roomNumber <= TOTAL_ROOMS;
roomNumber++
) {

const tenant =
tenants.find(
tenant =>
Number(tenant.room) ===
roomNumber
);


const room =
document.createElement(
"div"
);


room.className =
"room " +
(
tenant
? "occupied"
: "vacant"
);


if (tenant) {

room.innerHTML = `

<h3>
Room ${roomNumber}
</h3>

<p>🔴 Occupied</p>

<p>
<strong>
${tenant.name}
</strong>
</p>

<p>
${tenant.phone}
</p>

`;

} else {

room.innerHTML = `

<h3>
Room ${roomNumber}
</h3>

<p>🟢 Vacant</p>

`;

}


rooms.appendChild(room);

}

}



function renderRoomSelect() {

const select =
document.getElementById(
"tenantRoom"
);


select.innerHTML = `

<option value="">
Select a room
</option>

`;


for (
let roomNumber = 1;
roomNumber <= TOTAL_ROOMS;
roomNumber++
) {

const occupied =
tenants.some(
tenant =>
Number(tenant.room) ===
roomNumber
);


if (!occupied) {

const option =
document.createElement(
"option"
);

option.value =
roomNumber;

option.textContent =
"Room " +
roomNumber;

select.appendChild(
option
);

}

}

}



function renderTenantSelect() {

const select =
document.getElementById(
"paymentTenant"
);


select.innerHTML = `

<option value="">
Select a tenant
</option>

`;


tenants.forEach(
tenant => {

const option =
document.createElement(
"option"
);

option.value =
tenant.id;

option.textContent =
tenant.name +
" - Room " +
tenant.room;

select.appendChild(
option
);

});

}



function renderTenants() {

const container =
document.getElementById(
"tenantTable"
);


if (
tenants.length === 0
) {

container.innerHTML =

'<div class="empty">No tenants yet.</div>';

return;

}


let html = `

<table>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Room</th>

<th>Rent</th>

<th>Paid</th>

<th>Balance</th>

<th>Action</th>

</tr>

`;


tenants.forEach(
tenant => {

const paid =
getTenantPaid(
tenant.id
);


const balance =
Math.max(
Number(tenant.rent) -
paid,
0
);


html += `

<tr>

<td>
${tenant.name}
</td>

<td>
${tenant.phone}
</td>

<td>
Room ${tenant.room}
</td>

<td>
GH₵${Number(
tenant.rent
).toLocaleString()}
</td>

<td>
GH₵${paid.toLocaleString()}
</td>

<td
class="balance ${
balance > 0
? "owing"
: "paid"
}">

GH₵${balance.toLocaleString()}

</td>

<td>

<button
class="delete"
onclick="deleteTenant(${tenant.id})">

Remove

</button>

</td>

</tr>

`;

});


html += "</table>";

container.innerHTML =
html;

}



function renderPayments() {

const container =
document.getElementById(
"paymentTable"
);


if (
payments.length === 0
) {

container.innerHTML =

'<div class="empty">No payments recorded yet.</div>';

return;

}


let html = `

<table>

<tr>

<th>Date</th>

<th>Tenant</th>

<th>Room</th>

<th>Amount</th>

<th>Method</th>

</tr>

`;


payments
.slice()
.reverse()
.forEach(
payment => {

const tenant =
tenants.find(
t =>
Number(t.id) ===
Number(payment.tenantId)
);


if (!tenant) {
return;
}


html += `

<tr>

<td>
${payment.date}
</td>

<td>
${tenant.name}
</td>

<td>
Room ${tenant.room}
</td>

<td>
GH₵${Number(
payment.amount
).toLocaleString()}
</td>

<td>
${payment.method}
</td>

</tr>

`;

});


html += "</table>";

container.innerHTML =
html;

}



function renderStats() {

const occupied =
tenants.length;


const vacant =
TOTAL_ROOMS -
occupied;


let outstanding = 0;


tenants.forEach(
tenant => {

const paid =
getTenantPaid(
tenant.id
);


const balance =
Math.max(
Number(tenant.rent) -
paid,
0
);


outstanding +=
balance;

});


document.getElementById(
"occupiedRooms"
).textContent =
occupied;


document.getElementById(
"vacantRooms"
).textContent =
vacant;


document.getElementById(
"outstanding"
).textContent =
"GH₵" +
outstanding.toLocaleString();

}



function render() {

renderRooms();

renderRoomSelect();

renderTenantSelect();

renderTenants();

renderPayments();

renderStats();

}



document
.getElementById(
"addTenantButton"
)
.addEventListener(
"click",
addTenant
);


document
.getElementById(
"recordPaymentButton"
)
.addEventListener(
"click",
recordPayment
);


document
.getElementById(
"paymentDate"
)
.value =
new Date()
.toISOString()
.split("T")[0];


render();

</script>

</body>
</html>
