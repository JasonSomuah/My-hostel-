<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hostel Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }
#loginScreen {
  position: fixed;
  inset: 0;
  background: #f4f6f8;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loginBox {
  background: white;
  width: 90%;
  max-width: 380px;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  text-align: center;
}

.loginBox h2 {
  margin-bottom: 8px;
}

.loginBox p {
  color: #6b7280;
}

.loginBox input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
}

.loginBox button {
  width: 100%;
  padding: 13px;
  margin-top: 18px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#loginMessage {
  margin-top: 12px;
  color: #dc2626;
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 5px;
    }

    .rooms {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .room {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border-left: 6px solid #9ca3af;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .room.occupied {
      border-left-color: #22c55e;
    }

    .room.vacant {
      border-left-color: #3b82f6;
    }

    .room-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .room-title h3 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.occupied {
      background: #dcfce7;
      color: #166534;
    }

    .status.vacant {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .tenant-info {
      line-height: 1.7;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #111827;
      color: white;
      width: 100%;
      margin-top: 12px;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      margin-top: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 430px;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .save-btn {
      background: #16a34a;
      color: white;
      flex: 1;
    }

    .cancel-btn {
      background: #e5e7eb;
      flex: 1;
    }

    .message {
      text-align: center;
      padding: 15px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .rooms {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<div id="loginScreen">
  <div class="loginBox">
    <h2>Hostel Manager</h2>
    <p>Login to continue</p>

    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">

    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">

    <button onclick="login()">Login</button>

    <p id="loginMessage"></p>
  </div>
</div>
<header>
  <h1>🏠 Hostel Manager</h1>
  <p>16-Room Hostel Dashboard</p>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      Total Rooms
      <strong>16</strong>
    </div>

    <div class="stat">
      Occupied
      <strong id="occupiedCount">0</strong>
    </div>

    <div class="stat">
      Vacant
      <strong id="vacantCount">16</strong>
    </div>
  </div>

  <div id="rooms" class="rooms"></div>
  </div>

</div>

<div id="modal" class="modal">
  <div class="modal-box">

    <h2 id="modalTitle">Add Tenant</h2>

    <input type="hidden" id="tenantId">
    <input type="hidden" id="selectedRoom">

    <label>Tenant Name</label>
    <input id="tenantName" type="text" placeholder="Enter tenant name">

    <label>Phone Number</label>
    <input id="tenantPhone" type="tel" placeholder="Enter phone number">

    <label>Rent</label>
    <input id="tenantRent" type="number" placeholder="Enter rent amount">

    <label>Move-in Date</label>
    <input id="tenantMoveIn" type="date">

    <div class="form-buttons">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveTenant()">Save Tenant</button>
    </div>

  </div>
</div>

<script>

  /* =====================================================
     SUPABASE CONNECTION
     ===================================================== */

  const SUPABASE_URL = "https://qtxfvhbcquncmikuwkfa.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_uGhHxp5cMXEVRrJH0zTFyw_7rlRLR8p";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =====================================================
     HOSTEL SETTINGS
     ===================================================== */

  const TOTAL_ROOMS = 16;

  let tenants = [];


  /* =====================================================
     LOAD TENANTS
     ===================================================== */

  async function loadTenants() {

    const roomsContainer = document.getElementById("rooms");

    roomsContainer.innerHTML =
      '<div class="message">Loading rooms...</div>';

    const { data, error } = await supabaseClient
      .from("tenants")
      .select("*")
      .order("room", { ascending: true });

    if (error) {

      console.error("Supabase error:", error);

      roomsContainer.innerHTML = `
        <div class="message">
          Unable to load tenants.<br><br>
          ${error.message}
        </div>
      `;

      return;
    }

    tenants = data || [];

    displayRooms();
  }


  /* =====================================================
     DISPLAY 16 ROOMS
     ===================================================== */

  function displayRooms() {

    const roomsContainer = document.getElementById("rooms");

    if (!roomsContainer) {
      console.error("Rooms container not found");
      return;
    }

    roomsContainer.innerHTML = "";

    let occupied = 0;

    for (
      let roomNumber = 1;
      roomNumber <= TOTAL_ROOMS;
      roomNumber++
    ) {

      const tenant = tenants.find(
        t => String(t.room).trim() === String(roomNumber)
      );

      const room = document.createElement("div");

      room.className = tenant
        ? "room occupied"
        : "room vacant";


      if (tenant) {

        occupied++;

        room.innerHTML = `
          <div class="room-title">
            <h3>Room ${roomNumber}</h3>
            <span class="status occupied">Occupied</span>
          </div>

          <div class="tenant-info">
            <strong>Name:</strong>
            ${escapeHTML(tenant.name || "Tenant")}
            <br>

            <strong>Phone:</strong>
            ${escapeHTML(tenant.phone || "Not provided")}
            <br>

            <strong>Rent:</strong>
            ${tenant.rent || "Not provided"}
            <br>

            <strong>Move-in:</strong>
            ${tenant.move_in || "Not provided"}
          </div>

          <button
            class="delete-btn"
            onclick="deleteTenant('${tenant.id}')">
            Remove Tenant
          </button>
        `;

      } else {

        room.innerHTML = `
          <div class="room-title">
            <h3>Room ${roomNumber}</h3>
            <span class="status vacant">Vacant</span>
          </div>

          <div class="tenant-info">
            This room is currently vacant.
          </div>

          <button
            class="add-btn"
            onclick="openModal(${roomNumber})">
            Add Tenant
          </button>
        `;
      }


      roomsContainer.appendChild(room);
    }


    /* UPDATE DASHBOARD NUMBERS */

    const occupiedElement =
      document.getElementById("occupiedCount");

    const vacantElement =
      document.getElementById("vacantCount");


    if (occupiedElement) {
      occupiedElement.textContent = occupied;
    }

    if (vacantElement) {
      vacantElement.textContent =
        TOTAL_ROOMS - occupied;
    }
  }


  /* =====================================================
     OPEN ADD TENANT WINDOW
     ===================================================== */

  function openModal(roomNumber) {

    document.getElementById("selectedRoom").value =
      roomNumber;

    document.getElementById("modalTitle").textContent =
      "Add Tenant — Room " + roomNumber;

    document.getElementById("tenantName").value = "";
    document.getElementById("tenantPhone").value = "";
    document.getElementById("tenantRent").value = "";
    document.getElementById("tenantMoveIn").value = "";

    document.getElementById("modal").classList.add("show");
  }


  /* =====================================================
     CLOSE MODAL
     ===================================================== */

  function closeModal() {

    document.getElementById("modal")
      .classList.remove("show");
  }


  /* =====================================================
     SAVE TENANT
     ===================================================== */

  async function saveTenant() {

    const room =
      document.getElementById("selectedRoom").value;

    const name =
      document.getElementById("tenantName")
        .value.trim();

    const phone =
      document.getElementById("tenantPhone")
        .value.trim();

    const rent =
      document.getElementById("tenantRent").value;

    const moveIn =
      document.getElementById("tenantMoveIn").value;


    if (!name) {

      alert("Please enter the tenant's name.");

      return;
    }


    const { error } = await supabaseClient
      .from("tenants")
      .insert({

        name: name,

        room: room,

        rent: rent || null,

        phone: phone || null,

        move_in: moveIn || null
      });


    if (error) {

      console.error(error);

      alert(
        "Could not save tenant: " +
        error.message
      );

      return;
    }


    closeModal();

    await loadTenants();
  }


  /* =====================================================
     DELETE TENANT
     ===================================================== */

  async function deleteTenant(id) {

    const confirmed =
      confirm("Remove this tenant from the room?");

    if (!confirmed) {
      return;
    }


    const { error } = await supabaseClient
      .from("tenants")
      .delete()
      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Could not remove tenant: " +
        error.message
      );

      return;
    }


    await loadTenants();
  }


  /* =====================================================
     SECURITY / TEXT CLEANING
     ===================================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =====================================================
     START APPLICATION
     ===================================================== */
async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  if (!email || !password) {
    message.textContent = "Please enter your email and password.";
    return;
  }

  message.textContent = "Logging in...";
console.log("LOGIN FUNCTION STARTED");
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    console.error("Supabase login error:", error);
    message.textContent = "Incorrect email or password.";
    return;
  }

  message.textContent = "Login successful!";

  document.getElementById("loginScreen").style.display = "none";

  await loadTenants();
}
  supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) {
    document.getElementById("loginScreen").style.display = "none";
    loadTenants();
  }
});
  async function logout() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    console.error("Logout error:", error);
    alert("Could not log out.");
    return;
  }

  document.getElementById("loginScreen").style.display = "flex";
}
</script>
