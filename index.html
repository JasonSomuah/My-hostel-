<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel Management</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #182848;
    color: white;
    text-align: center;
    padding: 24px 15px;
}

header h1 {
    margin: 0 0 6px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.stat h3 {
    margin: 0 0 8px;
    color: #666;
    font-size: 14px;
}

.stat p {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section h2 {
    margin-top: 0;
}

.rooms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.room {
    padding: 16px;
    border-radius: 10px;
    border: 2px solid #ddd;
}

.room.vacant {
    background: #f1f8f2;
    border-color: #2e7d32;
}

.room.occupied {
    background: #fff4f4;
    border-color: #c62828;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    background: #182848;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button.green {
    background: #2e7d32;
}

button.red {
    background: #c62828;
}

.message {
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    display: none;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.paid {
    background: #dff3e2;
    color: #2e7d32;
}

.partial {
    background: #fff1cc;
    color: #996c00;
}

.unpaid {
    background: #ffdede;
    color: #c62828;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 11px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f1f3f5;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #777;
}

@media (max-width: 700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .rooms {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    table {
        display: block;
        overflow-x: auto;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏠 Hostel Management</h1>
    <p>Monthly Rent & Tenant Dashboard</p>
</header>

<div class="container">

<!-- DASHBOARD -->

<div class="stats">

<div class="stat">
<h3>Total Rooms</h3>
<p>16</p>
</div>

<div class="stat">
<h3>Occupied</h3>
<p id="occupiedRooms">0</p>
</div>

<div class="stat">
<h3>Vacant</h3>
<p id="vacantRooms">16</p>
</div>

<div class="stat">
<h3>Outstanding This Month</h3>
<p id="outstanding">GH₵0</p>
</div>

</div>


<!-- MONTH -->

<div class="section">

<h2>📅 Monthly Rent</h2>

<label>Select Month</label>

<select id="monthSelector"></select>

<p style="margin-top:12px;">
Rent is due on the <strong>1st of every month.</strong>
</p>

</div>


<!-- ROOMS -->

<div class="section">

<h2>🏠 Rooms</h2>

<div id="rooms" class="rooms"></div>

</div>


<!-- ADD TENANT -->

<div class="section">

<h2>👤 Add Tenant</h2>

<div class="form-grid">

<div>
<label>Tenant Name</label>
<input id="tenantName" type="text" placeholder="Enter tenant name">
</div>

<div>
<label>Phone Number</label>
<input id="tenantPhone" type="tel" placeholder="Enter phone number">
</div>

<div>
<label>Room</label>
<select id="tenantRoom">
<option value="">Select a room</option>
</select>
</div>

<div>
<label>Monthly Rent (GH₵)</label>
<input id="tenantRent" type="number" placeholder="Example: 1500">
</div>

</div>

<button id="addTenantButton">
Add Tenant
</button>

<div id="tenantMessage" class="message"></div>

</div>


<!-- MONTHLY RENT STATUS -->

<div class="section">

<h2>💰 Rent Status</h2>

<div id="rentStatus"></div>

</div>


<!-- PAYMENT -->

<div class="section">

<h2>💵 Record Payment</h2>

<div class="form-grid">

<div>
<label>Tenant</label>

<select id="paymentTenant">
<option value="">Select tenant</option>
</select>
</div>

<div>
<label>Amount (GH₵)</label>

<input
id="paymentAmount"
type="number"
placeholder="Enter amount">
</div>

<div>
<label>Payment Method</label>

<select id="paymentMethod">
<option>Cash</option>
<option>Mobile Money</option>
<option>Bank Transfer</option>
</select>
</div>

<div>
<label>Payment Date</label>

<input id="paymentDate" type="date">
</div>

</div>

<button
id="recordPaymentButton"
class="green">

Record Payment

</button>

<div id="paymentMessage" class="message"></div>

</div>


<!-- PAYMENT HISTORY -->

<div class="section">

<h2>📜 Payment History</h2>

<div id="paymentHistory"></div>

</div>

</div>


<script>

const TOTAL_ROOMS = 16;

let tenants = [];

let payments = [];

let selectedMonth = getCurrentMonth();


function getCurrentMonth() {

const date = new Date();

return date.getFullYear() + "-" +
String(date.getMonth() + 1).padStart(2, "0");

}


function saveData() {

localStorage.setItem(
"hostelMonthlyTenants",
JSON.stringify(tenants)
);

localStorage.setItem(
"hostelMonthlyPayments",
JSON.stringify(payments)
);

}


function loadData() {

tenants =
JSON.parse(
localStorage.getItem(
"hostelMonthlyTenants"
)
) || [];

payments =
JSON.parse(
localStorage.getItem(
"hostelMonthlyPayments"
)
) || [];

}


function money(amount) {

return "GH₵" +
Number(amount).toLocaleString();

}


function showMessage(
id,
text,
type
) {

const box =
document.getElementById(id);

box.textContent = text;

box.className =
"message " + type;

box.style.display = "block";

setTimeout(() => {

box.style.display = "none";

}, 3000);

}


/* MONTH SELECTOR */

function createMonths() {

const select =
document.getElementById(
"monthSelector"
);

const now = new Date();

select.innerHTML = "";

for (
let i = -12;
i <= 12;
i++
) {

const date =
new Date(
now.getFullYear(),
now.getMonth() + i,
1
);

const value =
date.getFullYear() +
"-" +
String(
date.getMonth() + 1
).padStart(2, "0");

const label =
date.toLocaleString(
"en-US",
{
month: "long",
year: "numeric"
}
);

const option =
document.createElement(
"option"
);

option.value = value;

option.textContent = label;

if (
value === selectedMonth
) {
option.selected = true;
}

select.appendChild(option);

}

select.onchange = function() {

selectedMonth =
this.value;

render();

};

}


/* ADD TENANT */

function addTenant() {

const name =
document
.getElementById("tenantName")
.value
.trim();

const phone =
document
.getElementById("tenantPhone")
.value
.trim();

const room =
document
.getElementById("tenantRoom")
.value;

const rent =
Number(
document
.getElementById("tenantRent")
.value
);


if (
!name ||
!phone ||
!room ||
!rent
) {

showMessage(
"tenantMessage",
"Please fill in all fields.",
"error"
);

return;

}


const roomTaken =
tenants.some(
tenant =>
Number(tenant.room) ===
Number(room)
);


if (roomTaken) {

showMessage(
"tenantMessage",
"This room is already occupied.",
"error"
);

return;

}


tenants.push({

id: Date.now(),

name: name,

phone: phone,

room: Number(room),

rent: rent,

moveIn:
new Date()
.toISOString()
.slice(0,10)

});


saveData();

document.getElementById(
"tenantName"
).value = "";

document.getElementById(
"tenantPhone"
).value = "";

document.getElementById(
"tenantRent"
).value = "";

render();

showMessage(
"tenantMessage",
"Tenant added successfully!",
"success"
);

}


/* GET PAYMENTS FOR MONTH */

function getPaymentsForTenantMonth(
tenantId,
month
) {

return payments.filter(
payment =>

Number(payment.tenantId) ===
Number(tenantId)

&&

payment.month === month

);

}


function getPaidForTenantMonth(
tenantId,
month
) {

return getPaymentsForTenantMonth(
tenantId,
month
)
.reduce(
(total, payment) =>
total +
Number(payment.amount),
0
);

}


/* RENT STATUS */

function getStatus(
rent,
paid
) {

if (paid >= rent) {

return {
text: "PAID",
className: "paid"
};

}

if (paid > 0) {

return {
text: "PARTIAL",
className: "partial"
};

}

return {
text: "UNPAID",
className: "unpaid"
};

}


/* RECORD PAYMENT */

function recordPayment() {

const tenantId =
Number(
document
.getElementById(
"paymentTenant"
).value
);

const amount =
Number(
document
.getElementById(
"paymentAmount"
).value
);

const method =
document
.getElementById(
"paymentMethod"
).value;

const date =
document
.getElementById(
"paymentDate"
).value;


if (
!tenantId ||
!amount ||
!date
) {

showMessage(
"paymentMessage",
"Please complete all payment fields.",
"error"
);

return;

}


const month =
date.slice(0,7);


payments.push({

id: Date.now(),

tenantId: tenantId,

amount: amount,

method: method,

date: date,

month: month

});


saveData();

document.getElementById(
"paymentAmount"
).value = "";

render();

showMessage(
"paymentMessage",
"Payment recorded successfully!",
"success"
);

}


/* ROOMS */

function renderRooms() {

const container =
document.getElementById(
"rooms"
);

container.innerHTML = "";

for (
let room = 1;
room <= TOTAL_ROOMS;
room++
) {

const tenant =
tenants.find(
t =>
Number(t.room) === room
);

const box =
document.createElement(
"div"
);

box.className =
"room " +
(
tenant
? "occupied"
: "vacant"
);

if (tenant) {

box.innerHTML = `

<h3>Room ${room}</h3>

<p>🔴 Occupied</p>

<p>
<strong>${tenant.name}</strong>
</p>

<p>${tenant.phone}</p>

<p>
Rent:
<strong>
${money(tenant.rent)}
</strong>
</p>

`;

} else {

box.innerHTML = `

<h3>Room ${room}</h3>

<p>🟢 Vacant</p>

`;

}

container.appendChild(box);

}

}


/* ROOM SELECT */

function renderRoomSelect() {

const select =
document.getElementById(
"tenantRoom"
);

select.innerHTML = `

<option value="">
Select a room
</option>

`;

for (
let room = 1;
room <= TOTAL_ROOMS;
room++
) {

const occupied =
tenants.some(
t =>
Number(t.room) === room
);

if (!occupied) {

const option =
document.createElement(
"option"
);

option.value = room;

option.textContent =
"Room " + room;

select.appendChild(option);

}

}

}


/* TENANT SELECT */

function renderTenantSelect() {

const select =
document.getElementById(
"paymentTenant"
);

select.innerHTML = `

<option value="">
Select tenant
</option>

`;

tenants.forEach(
tenant => {

const option =
document.createElement(
"option"
);

option.value =
tenant.id;

option.textContent =
tenant.name +
" - Room " +
tenant.room;

select.appendChild(option);

});

}


/* RENT STATUS TABLE */

function renderRentStatus() {

const container =
document.getElementById(
"rentStatus"
);

if (
tenants.length === 0
) {

container.innerHTML =
'<div class="empty">No tenants yet.</div>';

return;

}


let html = `

<table>

<tr>

<th>Tenant</th>
<th>Room</th>
<th>Rent</th>
<th>Paid</th>
<th>Balance</th>
<th>Status</th>

</tr>

`;


let outstanding = 0;


tenants.forEach(
tenant => {

const paid =
getPaidForTenantMonth(
tenant.id,
selectedMonth
);

const balance =
Math.max(
tenant.rent - paid,
0
);

outstanding += balance;

const status =
getStatus(
tenant.rent,
paid
);

html += `

<tr>

<td>
${tenant.name}
</td>

<td>
Room ${tenant.room}
</td>

<td>
${money(tenant.rent)}
</td>

<td>
${money(paid)}
</td>

<td>
${money(balance)}
</td>

<td>

<span
class="status ${status.className}">

${status.text}

</span>

</td>

</tr>

`;

});


html += "</table>";

container.innerHTML = html;


document.getElementById(
"outstanding"
).textContent =
money(outstanding);

}


/* PAYMENT HISTORY */

function renderPaymentHistory() {

const container =
document.getElementById(
"paymentHistory"
);

const monthPayments =
payments.filter(
payment =>
payment.month ===
selectedMonth
);


if (
monthPayments.length === 0
) {

container.innerHTML =
'<div class="empty">No payments for this month.</div>';

return;

}


let html = `

<table>

<tr>

<th>Date</th>
<th>Tenant</th>
<th>Room</th>
<th>Amount</th>
<th>Method</th>

</tr>

`;


monthPayments
.slice()
.reverse()
.forEach(
payment => {

const tenant =
tenants.find(
t =>
Number(t.id) ===
Number(payment.tenantId)
);

if (!tenant) {
return;
}

html += `

<tr>

<td>${payment.date}</td>

<td>${tenant.name}</td>

<td>Room ${tenant.room}</td>

<td>${money(payment.amount)}</td>

<td>${payment.method}</td>

</tr>

`;

});


html += "</table>";

container.innerHTML = html;

}


/* DASHBOARD */

function renderStats() {

const occupied =
tenants.length;

const vacant =
TOTAL_ROOMS -
occupied;

document.getElementById(
"occupiedRooms"
).textContent =
occupied;

document.getElementById(
"vacantRooms"
).textContent =
vacant;

}


/* RENDER */

function render() {

renderRooms();

renderRoomSelect();

renderTenantSelect();

renderStats();

renderRentStatus();

renderPaymentHistory();

}


/* BUTTONS */

document
.getElementById(
"addTenantButton"
)
.addEventListener(
"click",
addTenant
);

document
.getElementById(
"recordPaymentButton"
)
.addEventListener(
"click",
recordPayment
);


/* DATE */

document.getElementById(
"paymentDate"
).value =
new Date()
.toISOString()
.slice(0,10);


/* START */

loadData();

createMonths();

render();

</script>

</body>
</html>
